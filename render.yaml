# Render Blueprint: deploy the FastAPI backend as a Web Service.
# Create a separate static site or Vercel project for the Vite frontend.
services:
  - type: web
    name: excavation-risk-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
